name: stoat

services:
  # MongoDB: Database
  database:
    image: docker.io/mongo:7.0
    restart: always
    volumes:
      - ./data/db:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Redis: Event message broker & KV store
  redis:
    image: docker.io/eqalpha/keydb
    command: keydb-server /etc/keydb/keydb.conf
    restart: always
    ports:
      - "6379:6379"

  # RabbitMQ: Internal message broker
  rabbit:
    image: docker.io/rabbitmq:4
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - ./data/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MinIO: S3-compatible storage server
  minio:
    image: docker.io/minio/minio
    command: server /data
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: minioautumn
      MINIO_ROOT_PASSWORD: minioautumn
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          # legacy support:
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    restart: always

  # Caddy: Web server
  caddy:
    #image: livekit/caddyl4
    image: caddyl4dns:latest
    command: run --config /etc/caddy/Caddyfile
    env_file:
      - .env.web
      - .env.caddy
    ports:
      - "80:80"
      - "443:443"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy-data:/root/.local/share/caddy
      - ./data/caddy-config:/root/.config/caddy

  # API server
  api:
    image: ghcr.io/flash1232/stoatchat/server:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Events service
  events:
    image: ghcr.io/flash1232/stoatchat/bonfire:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Web App
  web:
    #image: ghcr.io/stoatchat/client:main
    image: ghcr.io/flash1232/stoatchat/client:justatest-dev
    ports:
      - "8080:8080"
    env_file: .env.web
    environment:
      NODE_ENV: production
      VITE_API_URL: https://holundersirup
      VITE_WS_URL: https://revolt.nanowaris.com/ws
      VITE_HCAPTCHA_SITEKEY: ""
      DOCKER_ENV: "true"
    depends_on:
      api:
        condition: service_started
    develop:
      watch:
        - action: sync+exec
          path: ./conf/nginx.conf
          target: /etc/nginx/conf.d/default.conf
          exec:
            command: nginx -s reload
    deploy:
      resources:
        limits:
          memory: "${PROD_MEMORY_LIMIT:-2G}"
          cpus: "${PROD_CPU_LIMIT:-1.0}"
        reservations:
          memory: "${PROD_MEMORY_RESERVATION:-512M}"
          cpus: "${PROD_CPU_RESERVATION:-0.25}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=1770
      - /var/cache/nginx:uid=101,gid=101,mode=1770
      - /var/run:uid=101,gid=101,mode=1770
      - /tmp:uid=101,gid=101,mode=1770
    restart: always

  # File server
  autumn:
    image: ghcr.io/flash1232/stoatchat/autumn:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Metadata and image proxy
  january:
    image: ghcr.io/flash1232/stoatchat/january:20251030-1-debug
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Tenor proxy
  gifbox:
    image: ghcr.io/flash1232/stoatchat/gifbox:20251030-1-debug
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Regular task daemon
  crond:
    image: ghcr.io/flash1232/stoatchat/crond:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # LiveKit server
  livekit:
    image: ghcr.io/flash1232/stoatchat/livekit-server:v1.9.9
    depends_on:
      redis:
        condition: service_started
      voiceingress:
        condition: service_started
    command: --config /etc/livekit.yml
    network_mode: "host"
    volumes:
      - ./livekit.yml:/etc/livekit.yml
    restart: always

  # Voice service
  voiceingress:
    image: ghcr.io/flash1232/stoatchat/voice-ingress:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    ports:
      - "8500:8500"
    restart: always

  # Push notification daemon
  pushd:
    image: ghcr.io/flash1232/stoatchat/pushd:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Create buckets for minio.
  createbuckets:
    image: docker.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn;
        echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads;
      exit 0;
      "
