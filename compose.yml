name: stoat

services:
  # MongoDB: Database
  database:
    image: docker.io/mongo
    restart: always
    volumes:
      - ./data/db:/data/db
    post_start:
      - command: mongosh --nodb --eval "disableTelemetry()"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Redis: Event message broker & KV store
  redis:
    image: docker.io/eqalpha/keydb
    command: keydb-server /etc/keydb/keydb.conf
    restart: always
    ports:
      - "6379:6379"

  # RabbitMQ: Internal message broker
  rabbit:
    image: docker.io/rabbitmq:4
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - ./data/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MinIO: S3-compatible storage server
  minio:
    image: docker.io/minio/minio
    command: server /data
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: minioautumn
      MINIO_ROOT_PASSWORD: minioautumn
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          # legacy support:
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    restart: always

  # Caddy: Web server
#  caddy:
#    image: docker.io/caddy
#    restart: always
#    env_file: .env.web
#    ports:
#      - "80:80"
#      - "443:443"
#    volumes:
#      - ./Caddyfile:/etc/caddy/Caddyfile
#      - ./data/caddy-data:/data
#      - ./data/caddy-config:/config

  caddy:
    image: livekit/caddyl4
    command: run --config /etc/caddy/Caddyfile
    env_file: .env.web
    ports:
      - "80:80"
      - "443:443"
    restart: always
#    extra_hosts:
#      - host.docker.internal:host-gateway
#      - "stoat-redis-1:10.89.0.19"
#      - "local.stoat.chat:192.168.0.20"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config

  # API server
  api:
    image: ghcr.io/stoatchat/server:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
      - "livekit:127.0.0.1"
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Events service
  events:
    image: ghcr.io/stoatchat/bonfire:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Web App
  web:
    #image: ghcr.io/stoatchat/client:main
    image: ghcr.io/flash1232/client:pr-2
    ports:
      - "${PROD_PORT:-8080}:8080"
    env_file: .env.web
    environment:
      NODE_ENV: production
      DOCKER_ENV: "true"
    depends_on:
      api:
        condition: service_started
    develop:
      watch:
        - action: sync+exec
          path: ./conf/nginx.conf
          target: /etc/nginx/conf.d/default.conf
          exec:
            command: nginx -s reload
    deploy:
      resources:
        limits:
          memory: "${PROD_MEMORY_LIMIT:-2G}"
          cpus: "${PROD_CPU_LIMIT:-1.0}"
        reservations:
          memory: "${PROD_MEMORY_RESERVATION:-512M}"
          cpus: "${PROD_CPU_RESERVATION:-0.25}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: always

  # File server
  autumn:
    image: ghcr.io/stoatchat/autumn:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Metadata and image proxy
  january:
    image: ghcr.io/stoatchat/january:20251030-1-debug
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Tenor proxy
  gifbox:
    image: ghcr.io/stoatchat/gifbox:20251030-1-debug
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Regular task daemon
  crond:
    image: ghcr.io/stoatchat/crond:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # LiveKit server
  livekit:
    image: stoatchat/livekit-server:v1.9.9-amd64
    depends_on:
      redis:
        condition: service_started
      voiceingress:
        condition: service_started
    command: --config /etc/livekit.yml
    network_mode: "host"
#    ports:
##      - "443:443"
#      - "443:443/udp"
#      - "7880:7880"
#      - "7881:7881"
#      - "50000-60000:50000-60000/udp"
    volumes:
      - ./livekit.yml:/etc/livekit.yml
    restart: always

  # Voice service
  voiceingress:
    image: ghcr.io/stoatchat/voice-ingress:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    ports:
      - "8500:8500"
    restart: always

  # Push notification daemon
  pushd:
    image: ghcr.io/stoatchat/pushd:20251030-1-debug
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Create buckets for minio.
  createbuckets:
    image: docker.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn;
        echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads;
      exit 0;
      "
